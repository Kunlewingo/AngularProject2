<!-- Interpolation -->
<h2>Student Profile</h2>
<p>Name: {{ studentName }}</p>
<p>Age: {{ studentAge }}</p>
<p>Age in 5 years: {{ studentAge + 5 }}</p>

<!-- Property Binding -->
<img [src]="profileImageUrl" alt="Student Photo">
<br>
<button [disabled]="isButtonDisabled">Submit</button>

<!-- Attribute Binding -->
<table border="1">
  <tr>
    <td>Course</td>
    <td>Grade</td>
  </tr>
  <tr>
    <td [attr.colspan]="colspanValue" [attr.aria-label]="'Merged cell with ' + colspanValue + ' columns'">
      Merged Cell
    </td>
  </tr>
</table>
